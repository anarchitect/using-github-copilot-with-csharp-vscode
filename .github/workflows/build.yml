name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore src/BackEnd/BackEnd.csproj --locked-mode
      - run: dotnet restore tests/BackEnd.Tests/BackEnd.Tests.csproj --locked-mode
      - run: dotnet restore src/FrontEnd/FrontEnd.csproj
      - run: dotnet build WeatherApp.slnx --no-restore --warnaserror
      - run: dotnet test WeatherApp.slnx --no-build --logger trx --results-directory TestResults
      - name: Check both running apps
        shell: pwsh
        run: ./scripts/Test-Smoke.ps1 -NoBuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
